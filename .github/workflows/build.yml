name: Build LliviumV2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DirectX SDK (June 2010)
        shell: powershell
        run: |
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $installer = "$env:TEMP\dxsdk.exe"
          Write-Host "Downloading DirectX SDK..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Installing silently (this may take a few minutes)..."
          Start-Process -FilePath $installer -ArgumentList "/Q" -Wait -NoNewWindow
          Write-Host "DirectX SDK installed."
          # Ensure the environment variable is set for later steps
          echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          msbuild LliviumV2.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild

      # (اختیاری) ذخیرهٔ فایل خروجی
      - uses: actions/upload-artifact@v4
        with:
          name: LliviumV2
          path: Release/LliviumV2.exe

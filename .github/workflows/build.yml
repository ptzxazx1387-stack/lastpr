name: Build LliviumV2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# اجازه‌ی لغو run قبلی وقتی commit جدید push می‌شود
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      DXSDK_DIR: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)'
      SOLUTION: LliviumV2.sln
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # کش کردن نصب‌کننده تا هر بار ۵۷۰MB دانلود نشود
      - name: Cache DirectX SDK installer
        id: cache-dxsdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\dxsdk.exe
          key: dxsdk-jun10-installer

      - name: Download DirectX SDK (June 2010)
        if: steps.cache-dxsdk.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'   # دانلود بسیار سریع‌تر
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $installer = "$env:RUNNER_TEMP\dxsdk.exe"
          Write-Host "Downloading DirectX SDK..."
          Invoke-WebRequest -Uri $url -OutFile $installer

      - name: Install DirectX SDK (June 2010)
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\dxsdk.exe"

          # --- رفع خطای S1023 ---
          # نصب‌کننده‌ی SDK اگر VC++ 2010 Redist جدیدتری روی سیستم باشد
          # با خطای S1023 شکست می‌خورد. runner ها این ها را از قبل دارند،
          # پس قبل از نصب حذفشان می‌کنیم.
          Write-Host "Removing conflicting VC++ 2010 Redistributables..."
          $redistGuids = @(
            '{F0C3E5D1-1ADE-321E-8167-68EF0DE699A5}',  # x64
            '{1D8E6291-B0D5-35EC-8441-6616F567A0F7}',  # x86
            '{A8D19029-8E5C-3E3A-8A81-95E3E4C69A5F}',
            '{DA5E371C-6333-3D8A-93A4-6FD5B20BCC6E}'
          )
          foreach ($guid in $redistGuids) {
            Start-Process "MsiExec.exe" -ArgumentList "/passive /norestart /X $guid" -Wait -ErrorAction SilentlyContinue
          }

          Write-Host "Installing DirectX SDK silently (may take a few minutes)..."
          $p = Start-Process -FilePath $installer -ArgumentList "/U" -Wait -PassThru -NoNewWindow
          Write-Host "Installer exit code: $($p.ExitCode)"

          # کدهای 0 و 1638 (نسخه‌ای از قبل نصب است) قابل قبول هستند
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1638) {
            Write-Error "DirectX SDK installation failed with code $($p.ExitCode)"
            exit 1
          }

          if (-not (Test-Path $env:DXSDK_DIR)) {
            Write-Error "DXSDK_DIR not found after install: $env:DXSDK_DIR"
            exit 1
          }
          Write-Host "DirectX SDK installed successfully."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # اگر پروژه پکیج NuGet دارد؛ اگر ندارد این step بی‌خطر رد می‌شود
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          if (Test-Path $env:SOLUTION) {
            nuget restore $env:SOLUTION
          }

      - name: Build solution
        shell: pwsh
        run: |
          msbuild $env:SOLUTION `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /t:Rebuild `
            /m `
            /verbosity:minimal `
            /nologo

      # پیدا کردن خودکار مسیر exe (چون x64 معمولاً در x64\Release قرار می‌گیرد)
      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter LliviumV2.exe |
                 Where-Object { $_.FullName -match 'Release' } |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "LliviumV2.exe not found!"
            Get-ChildItem -Path . -Recurse -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found: $($exe.FullName)"
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LliviumV2
          path: ${{ steps.locate.outputs.exe_path }}
          if-no-files-found: error
